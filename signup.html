<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Bit Crypto Chain Investment Crypto Investments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

    <!-- Sticky Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="glow-text-gold fs-4 fw-bold">Bit Crypto Chain Investment</span>
                <span class="text-white fs-6 ms-2 d-none d-sm-inline">CRYPTO INVESTMENTS</span>
            </a>
            <div class="d-flex align-items-center">
                <a href="index.html" class="btn btn-dark-glass btn-sm"><i class="fas fa-arrow-left me-2"></i>Home</a>
            </div>
        </div>
    </nav>

    <!-- Sign Up Form Section -->
    <section class="auth-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="glass-panel p-4 p-md-5 border-glow-gold text-start">
                        <div class="text-center mb-4">
                            <h3 class="text-white fw-bold glow-text-gold">Create Account</h3>
                            <p class="text-muted">Start accumulating verified digital daily yields</p>
                        </div>
                        
                        <div class="alert alert-danger d-none" id="signupErrorAlert"></div>
                        <div class="alert alert-success d-none" id="signupSuccessAlert"></div>

                        <form id="signupForm">
                            <div class="mb-3">
                                <label class="form-label form-label-custom">Full Name</label>
                                <input type="text" id="regName" class="form-control form-control-custom" placeholder="John Doe" required minlength="3">
                            </div>
                            <div class="mb-3">
                                <label class="form-label form-label-custom">Email Address</label>
                                <input type="email" id="regEmail" class="form-control form-control-custom" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label form-label-custom">Password</label>
                                <input type="password" id="regPassword" class="form-control form-control-custom" placeholder="••••••••" required minlength="8">
                                <small class="text-muted">Min. 8 characters with letters and numbers</small>
                            </div>
                            <div class="mb-4">
                                <label class="form-label form-label-custom">Confirm Password</label>
                                <input type="password" id="regConfirmPassword" class="form-control form-control-custom" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-gold w-100 py-3 mb-3"><i class="fas fa-user-plus me-2"></i>Register</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">Already registered? <a href="login.html" class="text-gold text-decoration-none">Sign In here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-3 border-top border-secondary border-opacity-10 text-center text-muted small">
        <p class="mb-0">&copy; 2016 Bit Crypto Chain Investment Crypto Investments. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const signupForm = document.getElementById('signupForm');
            if (signupForm) {
                signupForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const name = document.getElementById('regName').value;
                    const email = document.getElementById('regEmail').value;
                    const pass = document.getElementById('regPassword').value;
                    const confirmPass = document.getElementById('regConfirmPassword').value;

                    const errAlert = document.getElementById('signupErrorAlert');
                    const succAlert = document.getElementById('signupSuccessAlert');

                    errAlert.classList.add('d-none');
                    succAlert.classList.add('d-none');

                    if (pass !== confirmPass) {
                        errAlert.textContent = "Passwords do not match.";
                        errAlert.classList.remove('d-none');
                        return;
                    }

                    if (window.Auth) {
                        const response = await window.Auth.register(name, email, pass);
                        if (response.success) {
                            succAlert.innerHTML = "<strong>Registration successful!</strong> Redirecting to Login panel...";
                            succAlert.classList.remove('d-none');
                            signupForm.reset();
                            setTimeout(() => {
                                window.location.href = 'login.html';
                            }, 2500);
                        } else {
                            errAlert.textContent = response.message;
                            errAlert.classList.remove('d-none');
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
