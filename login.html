<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bit Crypto Chain Investment Crypto Investments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

    <!-- Sticky Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="glow-text-gold fs-4 fw-bold">Bit Crypto Chain Investment</span>
                <span class="text-white fs-6 ms-2 d-none d-sm-inline">CRYPTO INVESTMENTS</span>
            </a>
            <div class="d-flex align-items-center">
                <a href="index.html" class="btn btn-dark-glass btn-sm"><i class="fas fa-arrow-left me-2"></i>Home</a>
            </div>
        </div>
    </nav>

    <!-- Form Section -->
    <section class="auth-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="glass-panel p-4 p-md-5 border-glow-gold text-start">
                        <div class="text-center mb-4">
                            <h3 class="text-white fw-bold glow-text-gold">Welcome Back</h3>
                            <p class="text-muted">Enter your credentials to manage your portfolio</p>
                        </div>
                        
                        <div class="alert alert-danger d-none" id="loginErrorAlert"></div>

                        <form id="loginForm">
                            <!-- Anti-CSRF Token -->
                            <input type="hidden" id="login-csrf" class="csrf-field">

                            <div class="mb-3">
                                <label class="form-label form-label-custom">Email Address</label>
                                <input type="email" id="loginEmail" class="form-control form-control-custom" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <label class="form-label form-label-custom mb-0">Password</label>
                                    <a href="#" onclick="alert('Simulated password recovery link has been dispatched to your email address!')" class="text-gold text-decoration-none small">Forgot Password?</a>
                                </div>
                                <input type="password" id="loginPassword" class="form-control form-control-custom" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-gold w-100 py-3 mb-3"><i class="fas fa-right-to-bracket me-2"></i>Sign In</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">Don't have an account? <a href="signup.html" class="text-gold text-decoration-none">Sign Up here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-3 border-top border-secondary border-opacity-10 text-center text-muted small">
        <p class="mb-0">&copy; 2016 Bit Crypto Chain Investment Crypto Investments. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already logged in
            if (window.Auth && window.Auth.getCurrentUser()) {
                window.location.href = 'dashboard.html';
                return;
            }

            // Populate CSRF token
            const csrfInput = document.getElementById('login-csrf');
            if (csrfInput && window.Auth) {
                csrfInput.value = window.Auth.getCSRFToken();
            }

            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const email = document.getElementById('loginEmail').value;
                    const pass = document.getElementById('loginPassword').value;
                    const csrf = document.getElementById('login-csrf').value;

                    const alertBox = document.getElementById('loginErrorAlert');
                    alertBox.classList.add('d-none');

                    try {
                        const response = await window.Auth.login(email, pass, csrf);
                        if (response.success) {
                            window.location.href = 'dashboard.html';
                        } else {
                            alertBox.textContent = response.message || 'Invalid email or password';
                            alertBox.classList.remove('d-none');
                        }
                    } catch (err) {
                        alertBox.textContent = "Authentication System Error: " + err.message + ". Check your Firestore Database setup.";
                        alertBox.classList.remove('d-none');
                        console.error(err);
                    }
                });
            }
        });

    </script>
</body>
</html>
