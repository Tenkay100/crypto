<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Access - Bit Crypto Chain Investment</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background-image: linear-gradient(rgba(4, 8, 15, 0.93), rgba(4, 8, 15, 0.93)), url('assets/images/bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <img src="assets/images/logo.png" alt="Bit Crypto Chain logo" class="mb-3" style="height: 65px; border-radius: 6px; border: 1px solid var(--accent-gold); box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);">
                    <h3 class="glow-text-gold fw-bold mb-1">BIT CRYPTO CHAIN</h3>
                    <span class="badge bg-danger">ADMIN SECURE SIGN-IN</span>
                </div>

                <div class="glass-panel p-4 p-md-5">
                    <div class="alert alert-danger d-none" id="loginErrorAlert"></div>

                    <form id="adminLoginForm">
                        <input type="hidden" id="login-csrf" class="csrf-field">
                        
                        <div class="mb-3 text-start">
                            <label class="form-label form-label-custom small">Admin Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark-glass text-gold border-secondary border-opacity-25"><i class="fas fa-user-shield"></i></span>
                                <input type="email" id="loginEmail" class="form-control form-control-custom" placeholder="admin@toddcapital.com" required>
                            </div>
                        </div>

                        <div class="mb-4 text-start">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label form-label-custom small mb-0">System Password</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-dark-glass text-gold border-secondary border-opacity-25"><i class="fas fa-lock"></i></span>
                                <input type="password" id="loginPassword" class="form-control form-control-custom" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gold w-100 py-3 mb-3"><i class="fas fa-shield-halved me-2"></i>Access Admin Workspace</button>
                    </form>
                    
                    <button type="button" class="btn btn-dark-glass w-100 py-2 border-glow-gold" onclick="fillAdminDemo()">
                        <i class="fas fa-user-gear text-gold me-2"></i>Quick Fill Admin Account
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Bundles -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if already logged in as Admin
            if (window.Auth) {
                const curUser = window.Auth.getCurrentUser();
                if (curUser && curUser.role === 'admin') {
                    window.location.href = 'admin.html';
                    return;
                }
            }

            // Bind CSRF
            const csrfInput = document.getElementById('login-csrf');
            if (csrfInput && window.Auth) {
                csrfInput.value = window.Auth.getCSRFToken();
            }

            const loginForm = document.getElementById('adminLoginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const email = document.getElementById('loginEmail').value.trim();
                    const pass = document.getElementById('loginPassword').value;
                    const csrf = document.getElementById('login-csrf').value;

                    const alertBox = document.getElementById('loginErrorAlert');
                    alertBox.classList.add('d-none');

                    const response = await window.Auth.login(email, pass, csrf);
                    if (response.success && response.role === 'admin') {
                        // Log admin access in activity log
                        const logs = JSON.parse(localStorage.getItem('admin_activity_logs')) || [];
                        logs.unshift({
                            action: 'Admin Sign-in',
                            detail: `Admin session initialized for email: ${email}`,
                            timestamp: new Date().toLocaleString()
                        });
                        localStorage.setItem('admin_activity_logs', JSON.stringify(logs));

                        window.location.href = 'admin.html';
                    } else {
                        alertBox.textContent = response.message || 'Access Denied: Administrative privileges required.';
                        alertBox.classList.remove('d-none');
                    }
                });
            }
        });

        function fillAdminDemo() {
            document.getElementById('loginEmail').value = 'admin@toddcapital.com';
            document.getElementById('loginPassword').value = 'admin4321';
            const alertBox = document.getElementById('loginErrorAlert');
            alertBox.className = "alert alert-success animate-fade-in";
            alertBox.innerHTML = "<strong>Admin credentials ready!</strong> Click Access Workspace to log in.";
            alertBox.classList.remove('d-none');
        }
    </script>
</body>
</html>
